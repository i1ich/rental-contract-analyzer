name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - functions/generate-upload-url
          - functions/extract-text
          - functions/analyze-contract
          - infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        # GOLDEN_SET_DIR is intentionally unset here: GoldenSetValidationGateTest (T12) is
        # opt-in and skips itself when it's absent, since the golden set is real, private
        # contract data that never lives in this repo. CI only proves the pipeline builds and
        # the fully-offline unit test suites pass, not live LLM quality (that's T12, run
        # manually against a real OpenRouter key).
        run: ./mvnw -f ${{ matrix.module }}/pom.xml -B package

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # No VITE_API_BASE_URL here on purpose: CI only proves the build itself succeeds
        # (tsc + vite build), not that it's wired to a specific deployed API.
        run: npm run build
